name: Package Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-package:
    name: Build & Dist Check
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libssl-dev \
            libcurl4-openssl-dev \
            pkg-config \
            libsasl2-dev \
            protobuf-compiler \
            libprotobuf-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Generate Protocol
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --package protocol

      - name: Check Formatting
        run: cargo fmt -p function-stream -p function-stream-cli -- --check

      - name: Initialize Environment
        run: make env

      - name: Run Clippy
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Run Unit Tests
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: make test

      - name: Build & Package (Full)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: make dist

      - name: Build & Package (Lite)
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: make dist-lite

      - name: Show sccache Stats
        if: always()
        run: sccache --show-stats || true

      - name: Verify Artifacts
        run: |
          ls -lh dist/*.tar.gz dist/*.zip
          VERSION=$(grep '^version' Cargo.toml | head -1 | awk -F '"' '{print $2}')
          test -f "dist/function-stream-${VERSION}.tar.gz"
          test -f "dist/function-stream-${VERSION}-lite.tar.gz"
